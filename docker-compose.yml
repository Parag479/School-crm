version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: edumanage-postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: edumanage
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d edumanage"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: apps/backend/Dockerfile
    container_name: edumanage-backend
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PORT: 5000
      NODE_ENV: production
      DATABASE_URL: "postgresql://postgres:postgrespassword@postgres:5432/edumanage?schema=public"
      JWT_SECRET: "edumanage-super-secure-production-jwt-secret-key-32chars"
      JWT_REFRESH_SECRET: "edumanage-super-secure-production-refresh-secret-key-32chars"
      RAZORPAY_KEY_ID: "rzp_test_schoolerp123"
      RAZORPAY_KEY_SECRET: "rzp_secret_schoolerp456"
      CORS_ORIGIN: "http://localhost:3000"
    ports:
      - "5000:5000"
    volumes:
      - backend-uploads:/app/apps/backend/uploads

  frontend:
    build:
      context: .
      dockerfile: apps/frontend/Dockerfile
    container_name: edumanage-frontend
    restart: always
    depends_on:
      - backend
    ports:
      - "3000:80"

volumes:
  pgdata:
  backend-uploads:

